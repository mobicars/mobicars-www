# Every page of one locale, only what a URL is built from. See `modules/routes.ts`.
query PageRoutes($locale: I18NLocaleCode!, $status: PublicationStatus!, $page: Int!, $pageSize: Int!) {
  pages_connection(
    locale: $locale
    status: $status
    sort: "id"
    pagination: { page: $page, pageSize: $pageSize }
  ) {
    nodes {
      documentId
      slug
      updatedAt
      parentPage {
        documentId
      }
    }
    pageInfo {
      page
      pageCount
    }
  }
}

# The page with slug `404`, the copy of the not-found page (it has no URL of its own). See `modules/pages.ts`.
query NotFoundPage($locale: I18NLocaleCode!, $status: PublicationStatus!) {
  pages(locale: $locale, status: $status, filters: { slug: { eq: "404" } }, pagination: { limit: 1 }) {
    documentId
  }
}
