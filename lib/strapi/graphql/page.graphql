# One page and its `blocks`. The legacy `components` / `extraComponents` zones
# belong to mobicars-pl and are not read here.
query Page($documentId: ID!, $locale: I18NLocaleCode!, $status: PublicationStatus!) {
  page(documentId: $documentId, locale: $locale, status: $status) {
    documentId
    title
    seo {
      metaTitle
      metaDescription
      noIndex
      noFollow
    }
    blocks {
      __typename
      ... on ComponentBlocksHero {
        ...HeroBlock
      }
    }
  }
}

fragment Media on UploadFile {
  url
  mime
  width
  height
  alternativeText
}

fragment Link on ComponentElementsLink {
  label
  linkType
  customUrl
  newTab
  page {
    documentId
  }
  blog {
    slug
  }
}

fragment Cta on ComponentElementsCta {
  variant
  icon
  link {
    ...Link
  }
}

fragment HeroBlock on ComponentBlocksHero {
  id
  badge
  title
  subtitle
  ctas {
    ...Cta
  }
  backgroundImage {
    ...Media
  }
  backgroundImageMobile {
    ...Media
  }
  backgroundVideo {
    ...Media
  }
  overlay
  height
  reservationLayout
  reservationDefaultTerm
}
