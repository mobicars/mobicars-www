# The newest reviews in one language, for a Reviews section with `source: latest`.
query SectionReviews($locale: I18NLocaleCode!, $status: PublicationStatus!, $limit: Int!) {
  ratings(locale: $locale, status: $status, sort: ["date:desc", "documentId:asc"], pagination: { limit: $limit }) {
    ...SectionReview
  }
}

# Published reviews for `blocks.reviews`. The
# collection is small; the summary is computed over all of it.
query Reviews($status: PublicationStatus!) {
  ratings(status: $status, sort: ["date:desc"], pagination: { limit: 100 }) {
    documentId
    name
    rate
    text
    date
    source
  }
}

# `heading`: `title` is optional here but required on the other blocks, and
# GraphQL refuses one field name with two types in the same union selection.
fragment FeaturesBlock on ComponentBlocksFeatures {
  id
  heading: title
  variant
  items {
    title
    text
    icon
    tone
    image {
      ...Media
    }
    imageMobile {
      ...Media
    }
    link {
      ...Link
    }
  }
}

# `answer` is CKEditor HTML (or older blocks JSON); `internal/rich-blocks.ts`
# keeps what the site can render. `faqCta`: `cta` is a button on blog-posts.
fragment FaqBlock on ComponentBlocksFaq {
  id
  header {
    ...SectionHeader
  }
  items {
    question
    answer
    category {
      documentId
      name
      slug
      icon
      order
    }
  }
  structuredData
  groupByCategory
  faqCta: cta {
    ...Link
  }
  section {
    ...Section
  }
}

fragment SectionHeader on ComponentElementsSectionHeader {
  eyebrow
  title
  lead
}

fragment Section on ComponentElementsSection {
  tone
  spacing
  width
  anchor
  background
  backgroundImage {
    ...Media
  }
  backgroundImageMobile {
    ...Media
  }
  ornament
}

# Newest posts for a `blocks.blog-posts` block or a `sections.blog` section with `source: latest`,
# optionally of one category (`filters: { category: { documentId: { eq } } }`). By `createdAt`, the date
# shown on the cards: Strapi resets `publishedAt` on every publish.
query BlogCards(
  $locale: I18NLocaleCode!
  $status: PublicationStatus!
  $limit: Int!
  $filters: BlogFiltersInput
) {
  blogs(
    locale: $locale
    status: $status
    filters: $filters
    sort: ["createdAt:desc", "publishedAt:desc"]
    pagination: { limit: $limit }
  ) {
    ...BlogCard
  }
}

fragment BlogCard on Blog {
  documentId
  title
  slug
  excerpt
  publishedAt
  createdAt
  category {
    documentId
    name
    color
  }
  coverImage {
    ...Media
  }
}

fragment BlogPostsBlock on ComponentBlocksBlogPosts {
  id
  badge
  title
  subtitle
  source
  limit
  category {
    documentId
  }
  posts {
    ...BlogCard
  }
  cta {
    ...Cta
  }
}

