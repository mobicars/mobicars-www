query getPage(
  $status: PublicationStatus
  $locale: I18NLocaleCode
  $slug: String
) {
  pages_connection(
    status: $status
    locale: $locale
    filters: { slug: { eq: $slug } }
  ) {
    nodes {
      __typename
      title
      slug
      parentPage {
        slug
      }
      seo {
        ...Seo
      }
      apiReference
      localizations_connection {
        nodes {
          slug
          locale
        }
      }

      components {
        __typename

        ... on ComponentSharedContact {
          ...ContactFields
        }

        ... on ComponentSharedHeroPage {
          ...HeroPageFields
        }

        ... on ComponentSharedDivider {
          ...DividerFields
        }

        ... on ComponentSharedCardGroup {
          ...CardFields
        }

        ... on ComponentSharedFaq {
          items(pagination: { limit: 30 }) {
            ...FaqItemFields
          }
        }

        ... on ComponentSharedOpinions {
          ...OpinionsFields
        }

        ... on ComponentSharedButtons {
          ...ButtonsFields
        }

        ... on ComponentSharedTextHeading {
          ...TextHeadingFields
        }

        ... on ComponentSharedTextWithImage {
          ...TextWithImageFields
        }

        ... on ComponentSharedImage {
          ...ImageFields
        }

        ... on ComponentSharedCarsShow {
          ...CarsShowFields
        }

        ... on ComponentSharedBlogShow {
          ...BlogShowFields
        }

        ... on ComponentSharedText {
          ...TextFields
        }

        ... on ComponentSharedMap {
          fullScreen
        }

        ... on ComponentSharedBoxes {
          ...BoxesFields
        }

        ... on ComponentSharedPromoShow {
          ...PromoShowFields
        }
      }

      extraComponents {
        __typename

        ... on ComponentSharedContact {
          ...ContactFields
        }

        ... on ComponentSharedHeroPage {
          ...HeroPageFields
        }

        ... on ComponentSharedDivider {
          ...DividerFields
        }

        ... on ComponentSharedCardGroup {
          ...CardFields
        }

        ... on ComponentSharedFaq {
          items(pagination: { limit: 30 }) {
            ...FaqItemFields
          }
        }

        ... on ComponentSharedOpinions {
          ...OpinionsFields
        }

        ... on ComponentSharedButtons {
          ...ButtonsFields
        }

        ... on ComponentSharedTextHeading {
          ...TextHeadingFields
        }

        ... on ComponentSharedTextWithImage {
          ...TextWithImageFields
        }

        ... on ComponentSharedImage {
          ...ImageFields
        }

        ... on ComponentSharedCarsShow {
          ...CarsShowFields
        }

        ... on ComponentSharedBlogShow {
          ...BlogShowFields
        }

        ... on ComponentSharedText {
          ...TextFields
        }

        ... on ComponentSharedMap {
          fullScreen
        }

        ... on ComponentSharedBoxes {
          ...BoxesFields
        }
      }
    }
  }

  cities_connection(
    status: $status
    locale: $locale
    filters: { slug: { eq: $slug } }
  ) {
    nodes {
      __typename
      title
      slug
      apiReference
      seo {
        ...Seo
      }

      localizations_connection {
        nodes {
          slug
          locale
        }
      }

      components {
        __typename

        ... on ComponentSharedHeroPage {
          ...HeroPageFields
        }

        ... on ComponentSharedDivider {
          ...DividerFields
        }

        ... on ComponentSharedCardGroup {
          ...CardFields
        }

        ... on ComponentSharedFaq {
          items(pagination: { limit: 30 }) {
            ...FaqItemFields
          }
        }

        ... on ComponentSharedTextHeading {
          ...TextHeadingFields
        }

        ... on ComponentSharedTextWithImage {
          ...TextWithImageFields
        }

        ... on ComponentSharedCarsShow {
          ...CarsShowFields
        }

        ... on ComponentSharedBlogShow {
          ...BlogShowFields
        }

        ... on ComponentSharedText {
          ...TextFields
        }

        ... on ComponentSharedMap {
          fullScreen
        }

        ... on ComponentSharedBoxes {
          ...BoxesFields
        }
      }
    }
  }

  servicePoints_connection(
    status: $status
    locale: $locale
    filters: { slug: { eq: $slug } }
  ) {
    nodes {
      __typename
      title
      slug
      apiReference
      city {
        title
        slug
      }
      seo {
        ...Seo
      }

      localizations_connection {
        nodes {
          slug
          locale
        }
      }

      components {
        __typename

        ... on ComponentSharedHeroPage {
          ...HeroPageFields
        }

        ... on ComponentSharedDivider {
          ...DividerFields
        }

        ... on ComponentSharedCardGroup {
          ...CardFields
        }

        ... on ComponentSharedFaq {
          items(pagination: { limit: 30 }) {
            ...FaqItemFields
          }
        }

        ... on ComponentSharedTextHeading {
          ...TextHeadingFields
        }

        ... on ComponentSharedTextWithImage {
          ...TextWithImageFields
        }

        ... on ComponentSharedImage {
          ...ImageFields
        }

        ... on ComponentSharedCarsShow {
          ...CarsShowFields
        }

        ... on ComponentSharedBlogShow {
          ...BlogShowFields
        }

        ... on ComponentSharedText {
          ...TextFields
        }

        ... on ComponentSharedMap {
          fullScreen
        }

        ... on ComponentSharedBoxes {
          ...BoxesFields
        }
      }
    }
  }
}
