# One page and its `sections`. The legacy `components` / `extraComponents`
# zones belong to mobicars-pl and are not read here.
query Page($documentId: ID!, $locale: I18NLocaleCode!, $status: PublicationStatus!) {
  page(documentId: $documentId, locale: $locale, status: $status) {
    documentId
    title
    seo {
      metaTitle
      metaDescription
      noIndex
      noFollow
      shareImage {
        ...Media
      }
    }
    sections {
      __typename
      ... on ComponentSectionsHero {
        ...HeroSection
      }
      ... on ComponentSectionsFeatures {
        ...FeaturesSection
      }
      ... on ComponentSectionsText {
        ...TextSection
      }
      ... on ComponentSectionsFaq {
        ...FaqSection
      }
      ... on ComponentSectionsCards {
        ...CardsSection
      }
      ... on ComponentSectionsBlog {
        ...BlogSection
      }
      ... on ComponentSectionsSocial {
        ...SocialSection
      }
      ... on ComponentSectionsCars {
        ...CarsSection
      }
      ... on ComponentSectionsCarClasses {
        ...CarClassesSection
      }
      ... on ComponentSectionsExtras {
        ...ExtrasSection
      }
      ... on ComponentSectionsPromotions {
        ...PromotionsSection
      }
      ... on ComponentSectionsMap {
        ...MapSection
      }
      ... on ComponentSectionsSplit {
        ...SplitSection
      }
      ... on ComponentSectionsForm {
        ...FormSection
      }
      ... on ComponentSectionsReviews {
        ...ReviewsSection
      }
      ... on ComponentSectionsImage {
        ...ImageSection
      }
      ... on ComponentSectionsDivider {
        ...DividerSection
      }
      ... on ComponentSectionsVariantLabel {
        id
        title
        note
      }
    }
  }
}

# Also in `site.contact.departments` (chrome.graphql).
# The newest reviews in one language, for a Reviews section with `source: latest`.
query SectionReviews($locale: I18NLocaleCode!, $status: PublicationStatus!, $limit: Int!) {
  ratings(locale: $locale, status: $status, sort: ["date:desc", "documentId:asc"], pagination: { limit: $limit }) {
    ...SectionReview
  }
}

# Newest posts for a `sections.blog` section with `source: latest`, or a post's
# related posts (`filters` leaves the post out). By `createdAt`, the date
# shown on the cards: Strapi resets `publishedAt` on every publish.
query BlogCards(
  $locale: I18NLocaleCode!
  $status: PublicationStatus!
  $limit: Int!
  $filters: BlogFiltersInput
) {
  blogs(
    locale: $locale
    status: $status
    filters: $filters
    sort: ["createdAt:desc", "publishedAt:desc"]
    pagination: { limit: $limit }
  ) {
    ...BlogCard
  }
}

fragment BlogCard on Blog {
  documentId
  title
  slug
  excerpt
  publishedAt
  createdAt
  coverImage {
    ...Media
  }
}

# `sections.hero` (`lib/strapi/internal/sections.ts`).
