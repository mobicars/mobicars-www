# City and airport pages (`city`) and local pickup pages (`local-page`), served at
# the old site's URLs. See `modules/places.ts`. The legacy `components` zone
# belongs to mobicars-pl and is not read here; `sections` is the same zone as a page's.
query CityRoutes($locale: I18NLocaleCode!, $status: PublicationStatus!, $page: Int!, $pageSize: Int!) {
  cities_connection(locale: $locale, status: $status, sort: "id", pagination: { page: $page, pageSize: $pageSize }) {
    nodes {
      documentId
      slug
      updatedAt
    }
    pageInfo {
      page
      pageCount
    }
  }
}

query LocalPageRoutes($locale: I18NLocaleCode!, $status: PublicationStatus!, $page: Int!, $pageSize: Int!) {
  localPages_connection(locale: $locale, status: $status, sort: "id", pagination: { page: $page, pageSize: $pageSize }) {
    nodes {
      documentId
      slug
      updatedAt
    }
    pageInfo {
      page
      pageCount
    }
  }
}

query City($documentId: ID!, $locale: I18NLocaleCode!, $status: PublicationStatus!) {
  city(documentId: $documentId, locale: $locale, status: $status) {
    documentId
    title
    # The page's RentCarSoft point (one for every language): the booking search starts there.
    pickupPoint
    seo {
      metaTitle
      metaDescription
      noIndex
      noFollow
      shareImage {
        ...Media
      }
    }
    sections {
      __typename
      ... on ComponentSectionsHero {
        ...HeroSection
      }
      ... on ComponentSectionsFeatures {
        ...FeaturesSection
      }
      ... on ComponentSectionsText {
        ...TextSection
      }
      ... on ComponentSectionsFaq {
        ...FaqSection
      }
      ... on ComponentSectionsCards {
        ...CardsSection
      }
      ... on ComponentSectionsBlog {
        ...BlogSection
      }
      ... on ComponentSectionsSocial {
        ...SocialSection
      }
      ... on ComponentSectionsCars {
        ...CarsSection
      }
      ... on ComponentSectionsSales {
        ...SalesSection
      }
      ... on ComponentSectionsCarClasses {
        ...CarClassesSection
      }
      ... on ComponentSectionsExtras {
        ...ExtrasSection
      }
      ... on ComponentSectionsPromotions {
        ...PromotionsSection
      }
      ... on ComponentSectionsMap {
        ...MapSection
      }
      ... on ComponentSectionsSplit {
        ...SplitSection
      }
      ... on ComponentSectionsForm {
        ...FormSection
      }
      ... on ComponentSectionsReviews {
        ...ReviewsSection
      }
      ... on ComponentSectionsImage {
        ...ImageSection
      }
      ... on ComponentSectionsDivider {
        ...DividerSection
      }
      ... on ComponentSectionsVariantLabel {
        id
        title
        note
      }
    }
  }
}

query LocalPage($documentId: ID!, $locale: I18NLocaleCode!, $status: PublicationStatus!) {
  localPage(documentId: $documentId, locale: $locale, status: $status) {
    documentId
    title: Title
    pickupPoint
    seo {
      metaTitle
