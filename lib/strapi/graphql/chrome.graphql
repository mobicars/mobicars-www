# The header, footer and site-wide settings, one request for every page. See `modules/chrome.ts`.
query Chrome($locale: I18NLocaleCode!, $status: PublicationStatus!) {
  layout(locale: $locale, status: $status) {
    header {
      label
      submenu
      link {
        ...PartLink
      }
      links {
        ...PartLink
      }
    }
    footerGroups {
      title
      links {
        ...PartLink
      }
    }
    headerCta {
      ...PartLink
    }
    topLinks {
      ...PartLink
    }
    footerText
    legalLinks {
      ...PartLink
    }
    paymentMethods {
      method
    }
    companyName
    legalText
  }
  announcement(locale: $locale, status: $status) {
    documentId
    updatedAt
    enabled
    text
    variant
    link {
      ...PartLink
    }
    startsAt
    endsAt
    closable
  }
  site(locale: $locale, status: $status) {
    seo {
      ...Seo
    }
    contact {
      phone
      email
      salesPhone
      salesEmail
      address
      openingHours
      availabilityNote
      whatsapp
      chatUrl
      hours {
        days
        from
        to
        closed
      }
      legalName
      nip
      regon
      krs
      mapUrl
    }
    appStoreUrl
    googlePlayUrl
    social {
      platform
      url
    }
  }
}

# Newest blog posts, for the "blog" submenu.
query LatestPosts($locale: I18NLocaleCode!, $status: PublicationStatus!, $limit: Int!) {
  blogs(
    locale: $locale
    status: $status
    sort: ["createdAt:desc", "publishedAt:desc"]
    pagination: { limit: $limit }
  ) {
    documentId
    title
    slug
    coverImage {
      ...Media
    }
  }
}

fragment Seo on ComponentPartsSeo {
  metaTitle
  metaDescription
  metaKeywords
  noIndex
  noFollow
  shareImage {
    ...Media
  }
}
