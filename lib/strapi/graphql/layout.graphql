query getLayout($status: PublicationStatus, $locale: I18NLocaleCode) {
  navigation(status: $status, locale: $locale) {
    items {
      __typename
      ... on ComponentSharedLink {
        ...Link
      }
      ... on ComponentSharedLinkGroup {
        groupTitle: title
        links {
          ...Link
        }
      }
    }
  }

  social(status: $status) {
    items {
      url
      id
    }
  }

  points: servicePoints_connection(
    status: $status
    locale: $locale
    pagination: { limit: 999 }
    sort: "title"
  ) {
    nodes {
      locale
      title
      slug
      city {
        slug
      }
    }
  }

  cities: cities_connection(
    status: $status
    locale: $locale
    pagination: { limit: 999 }
    sort: "title"
  ) {
    nodes {
      locale
      title
      slug
    }
  }

  footer(status: $status, locale: $locale) {
    nav {
      __typename
      ... on ComponentSharedLinkGroup {
        groupTitle: title
        links {
          ...Link
        }
      }
    }

    extraNavs {
      __typename
      ... on ComponentSharedLinkGroup {
        groupTitle: title
        links(pagination: { limit: 50 }) {
          ...Link
        }
      }
    }

    info
  }

  infobar(status: $status, locale: $locale) {
    Information
    isActive
    isUrgent
    updatedAt
    Link {
      ...Link
    }
  }
}
