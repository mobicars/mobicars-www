query getDocument(
  $status: PublicationStatus
  $locale: I18NLocaleCode
  $slug: String
) {
  regulations_connection(
    status: $status
    locale: $locale
    filters: { slug: { eq: $slug } }
  ) {
    nodes {
      __typename
      title
      slug
      file {
        url
      }

      localizations_connection {
        nodes {
          slug
          locale
        }
      }
    }
  }
}
