# Blog posts at the old site's URLs, `/{lang}/blog/{slug}` (`modules/blog.ts`). Like
# pages, only the new `sections` zone is read; `components` belongs to mobicars-pl.

# Every post of one language, only what a URL and the sitemap need.
query BlogRoutes($locale: I18NLocaleCode!, $status: PublicationStatus!, $page: Int!, $pageSize: Int!) {
  blogs_connection(locale: $locale, status: $status, sort: "id", pagination: { page: $page, pageSize: $pageSize }) {
    nodes {
      documentId
      slug
      updatedAt
    }
    pageInfo {
      page
      pageCount
    }
  }
}

query BlogPost($documentId: ID!, $locale: I18NLocaleCode!, $status: PublicationStatus!) {
  blog(documentId: $documentId, locale: $locale, status: $status) {
    ...BlogCard
    updatedAt
    seo {
      metaTitle
      metaDescription
      noIndex
      noFollow
      shareImage {
        ...Media
      }
    }
    sections {
      __typename
      ... on ComponentSectionsHero {
        ...HeroSection
      }
      ... on ComponentSectionsFeatures {
        ...FeaturesSection
      }
      ... on ComponentSectionsText {
        ...TextSection
      }
      ... on ComponentSectionsFaq {
        ...FaqSection
      }
      ... on ComponentSectionsCards {
        ...CardsSection
      }
      ... on ComponentSectionsBlog {
        ...BlogSection
      }
      ... on ComponentSectionsSocial {
        ...SocialSection
      }
      ... on ComponentSectionsCars {
        ...CarsSection
      }
      ... on ComponentSectionsCarClasses {
        ...CarClassesSection
      }
      ... on ComponentSectionsExtras {
        ...ExtrasSection
      }
      ... on ComponentSectionsPromotions {
        ...PromotionsSection
      }
      ... on ComponentSectionsMap {
        ...MapSection
      }
      ... on ComponentSectionsSplit {
        ...SplitSection
      }
      ... on ComponentSectionsForm {
        ...FormSection
      }
      ... on ComponentSectionsReviews {
        ...ReviewsSection
      }
      ... on ComponentSectionsImage {
        ...ImageSection
      }
      ... on ComponentSectionsDivider {
        ...DividerSection
      }
      ... on ComponentSectionsVariantLabel {
        id
        title
        note
      }
    }
  }
}
